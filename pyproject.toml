[project]
name = "messages-batch-ex"
version = "0.1.0"
description = "Learning project: extracting fake invoices with the Claude Message Batches API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "reportlab>=5.1.0",
]

# One command per stage:  uv run <command>
[project.scripts]
generate-invoices = "invoice_batch.cli.generate_invoices:main"
show-schema = "invoice_batch.cli.show_schema:main"
dry-run = "invoice_batch.cli.dry_run:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "invoice_batch"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
